name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The builds that produce a binary for the part.  Everything else here runs on
  # this machine, and where a section lands is a property of a link for the
  # part, so nothing else can see it.
  #
  # The tinyusb example is the C's: the only build that exercises
  # picobootx_vendor.c and the linker placement its flash erase needs.  The
  # embassy example is the Rust's counterpart, and the only build that links
  # picobootx-embassy against a real USB stack for the part.
  # ci/ramfunc-probe is the Rust's, a cortex-m-rt program that calls
  # flash_erase and is linked the way the crate tells a consumer to link it.
  # The rust job's cross-target lint compiles that code and links none of it,
  # so a .ramfunc placed nowhere passes it — see ci/check-ramfunc.sh.
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabi

      - name: Build tinyusb example
        run: make example

      - name: Build embassy example
        run: make example-embassy

      # The hardware test's two halves.  Built, not run - they want a board.
      # Building them is what stops them rotting against picobootx-embassy.
      - name: Build the hardware test
        run: make hw-device hw-host

      # The probe answers for the crate's linker fragment.  The second call
      # answers for a consumer of it, which is a different question: whether
      # this link passed the two flags the crate asks for.  Dropping one links
      # clean and faults at runtime.
      - name: Check where the Rust RAM function landed
        run: |
          ci/check-ramfunc.sh
          ci/check-ramfunc.sh test/hw/device picobootx-hw-device

      # The C's counterpart, over the tinyusb example, which is the only C link
      # this repository makes.  The two scripts ask the same question of
      # different copies - see ci/check-ramfunc-c.sh.
      - name: Check where the C RAM functions landed
        run: ci/check-ramfunc-c.sh

  # The conformance suite needs a C compiler and make, and nothing else — no
  # USB, no kernel modules, no privileges — so it runs on hosted runners.  Both
  # operating systems are here because picobootx's value is portability, and
  # both compilers because an integrator brings their own.
  #
  # The logging entry builds picobootx's own log statements in.  They are
  # variadic calls the ordinary build compiles away entirely, so nothing else
  # here would notice a format string that no longer matches its arguments.
  #
  # Both implementations are run.  LIB=c is the C in src, LIB=rust the Rust
  # library in rust, and the scenarios are the same either way — see the
  # conformance suite section of CLAUDE.md.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            lib: c
            sanitize: '0'
            logging: '0'
          - os: ubuntu-latest
            cc: clang
            lib: c
            sanitize: '0'
            logging: '0'
          - os: ubuntu-latest
            cc: clang
            lib: c
            sanitize: '1'
            logging: '0'
          - os: ubuntu-latest
            cc: clang
            lib: c
            sanitize: '0'
            logging: '1'
          - os: macos-latest
            cc: clang
            lib: c
            sanitize: '0'
            logging: '0'
          - os: ubuntu-latest
            cc: gcc
            lib: rust
            sanitize: '0'
            logging: '0'
          - os: ubuntu-latest
            cc: clang
            lib: rust
            sanitize: '1'
            logging: '0'
          - os: ubuntu-latest
            cc: clang
            lib: rust
            sanitize: '0'
            logging: '1'
          - os: macos-latest
            cc: clang
            lib: rust
            sanitize: '0'
            logging: '0'
    runs-on: ${{ matrix.os }}
    name: >-
      test (${{ matrix.os }}, ${{ matrix.cc }}, ${{ matrix.lib }},
      sanitize ${{ matrix.sanitize }}, logging ${{ matrix.logging }})
    steps:
      - uses: actions/checkout@v4

      # Pinned to stable rather than taken from the image, so a runner update
      # cannot change which compiler built the library under test.
      - name: Install the Rust toolchain
        if: matrix.lib == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Build and run the conformance suites
        env:
          CC: ${{ matrix.cc }}
        run: |
          make test LIB=${{ matrix.lib }} \
              SANITIZE=${{ matrix.sanitize }} LOGGING=${{ matrix.logging }}

  # The Rust library on its own terms.  The suite above says it behaves
  # correctly, and says nothing about whether it is well formed Rust.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabi

      # Six workspaces, and --all reaches only the members of the one it is
      # asked in.  rust/interop, examples/embassy, ci/ramfunc-probe and the two
      # halves of test/hw are each their own, so each is named here or nothing
      # checks it.
      - name: Check formatting
        run: |
          (cd rust && cargo fmt --all -- --check)
          (cd rust/interop && cargo fmt -- --check)
          (cd examples/embassy && cargo fmt -- --check)
          (cd ci/ramfunc-probe && cargo fmt -- --check)
          (cd test/hw/device && cargo fmt -- --check)
          (cd test/hw/host && cargo fmt -- --check)

      # The crates' own tests, of the API surface the conformance suite reaches
      # through the C ABI and therefore cannot exercise: an Ops that leaves a
      # method to its default, and Rp2350 held as a Rust type.  The coverage
      # job runs these too — this is where a failing one fails fast, and
      # without waiting for lcov to be built.
      - name: Run the crates' own tests
        run: make test-unit

      # interop is a workspace of its own, so make test-unit's -p list does not
      # reach it.  Its tests are what decide whether that tool will open a
      # device, and nothing else runs them.
      - name: Run the interop driver's tests
        run: cd rust/interop && cargo test

      # The same six.  examples/embassy, ci/ramfunc-probe and test/hw/device
      # build for the part rather than for this machine, from the target in each
      # one's .cargo/config.toml.  Each declares `test = false` and `bench =
      # false` on its binary, since a bare-metal target has no test harness to
      # build, and that is what lets --all-targets be asked of them too.
      - name: Lint
        run: |
          (cd rust && cargo clippy --workspace --all-targets --release -- -D warnings)
          (cd rust/interop && cargo clippy --all-targets --release -- -D warnings)
          (cd examples/embassy && cargo clippy --all-targets --release -- -D warnings)
          (cd ci/ramfunc-probe && cargo clippy --all-targets --release -- -D warnings)
          (cd test/hw/device && cargo clippy --all-targets --release -- -D warnings)
          (cd test/hw/host && cargo clippy --all-targets --release -- -D warnings)

      # Whether the documents build and their links still resolve.  missing_docs
      # catches a public item with nothing written about it, and nothing catches
      # what is written having gone stale - a link to a renamed item is a
      # warning, and warnings are not read.
      - name: Build the documents
        run: ci/rust-docs.sh

      # The default RP2350 implementations again, for the part.  The lint above
      # runs on this machine, where the host half of the seam is selected and
      # the device half — absolute addresses, a transmute, two asm blocks and
      # the .ramfunc placement — is compiled by nobody.
      #
      # picobootx-embassy too, with the feature on.  Rp2350EndpointControl
      # exists only in a build for the part, and clippy lints the crate it is
      # asked for rather
      # than the dependencies underneath it - so a device building the example
      # compiles that code without anything ever linting it.
      #
      # No --all-targets on either.  A library's test module is built for this
      # machine and wants std, which the part has not got.
      - name: Lint the default implementations for the part
        run: |
          (cd rust && cargo clippy -p picobootx-rp2350 \
              --target thumbv8m.main-none-eabi --release -- -D warnings)
          (cd rust && cargo clippy -p picobootx-embassy --features rp2350 \
              --target thumbv8m.main-none-eabi --release -- -D warnings)

  # The oldest Rust the published crates claim to build on.  `rust-version` is
  # a promise a consumer's cargo enforces, and nothing else here would notice it
  # going stale: every other job runs on stable, where a newer standard library
  # method compiles without a word and silently raises the real floor.
  #
  # --locked, so the check is made against the dependency versions in
  # Cargo.lock.  Without it a dependency may resolve to a release needing a
  # newer compiler, and the job fails for something that is not this
  # repository's floor.
  #
  # Twice, for the same reason the lint above runs twice.  The host build
  # compiles the host half of the seam, and the part's build is where the
  # absolute addresses, the asm and the .ramfunc placement are compiled at all.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: thumbv8m.main-none-eabi

      - name: Build the published crates on the oldest Rust they claim
        run: |
          (cd rust && cargo check --locked \
              -p picobootx -p picobootx-rp2350 -p picobootx-embassy)
          (cd rust && cargo check --locked \
              -p picobootx-rp2350 -p picobootx-embassy \
              --features picobootx-embassy/rp2350 \
              --target thumbv8m.main-none-eabi)

  # How much of the library the suites reach, in both languages, merged.
  #
  # The C is gated outright: every line and every function of picobootx.c,
  # picobootx_impl.c and picobootx_vendor.c, with the handful that defend an
  # invariant already established marked unreachable in the source.  So a new
  # line nothing reaches fails here, and so does dropping the only test that
  # reached an existing one.  Branches are printed but not gated, since gcc and
  # llvm-cov disagree on what one is.
  #
  # The Rust is gated against the per-file floors in ci/coverage-baseline.txt,
  # which may go up and not down.  Those floors are raised from this job's
  # figures: a different machine measures differently, and a floor taken from
  # one is not a floor this can meet.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu packages an lcov too old to read the counters a current gcc
      # writes, so the version used here is built from its own release tag.
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y perl libcapture-tiny-perl libjson-xs-perl \
                                  libdatetime-perl
          git clone https://github.com/linux-test-project/lcov.git
          cd lcov
          git checkout v2.4
          make install PREFIX=$HOME/lcov-install
          echo "$HOME/lcov-install/bin" >> $GITHUB_PATH

      # llvm-tools carries llvm-profdata and llvm-cov, which read what
      # -C instrument-coverage wrote.  Taken from the toolchain that wrote it,
      # so a system LLVM of some other vintage cannot answer instead.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Measure coverage
        env:
          CC: gcc
        run: make cov

      # tee, so the figures reach the run page as well as the log.  pipefail, or
      # tee's exit status hides a failing gate.
      - name: Coverage figures
        if: always()
        run: |
          set -o pipefail
          ci/coverage-report.sh | tee coverage-figures.txt

      - name: Check the floors
        if: always()
        run: |
          set -o pipefail
          ci/coverage-report.sh --check | tee coverage-check.txt

      # The numbers are the point of the job, and a log needs an account to
      # read.  This puts them on the run page instead, readable by anyone who
      # can see the repository.  always(), so a failed gate is shown rather than
      # hidden.
      - name: Figures on the run page
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            cat coverage-figures.txt 2>/dev/null || echo "(the run did not get this far)"
            echo '```'
            echo
            echo '### Floors'
            echo
            echo '```'
            cat coverage-check.txt 2>/dev/null || echo "(the check did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tracefiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tracefiles
          path: test/build/coverage/*.info

  # picobootx on a real USB bus, driven by real picotool.  The kernel's virtual
  # host controller is the host and a socket is the bus, so nothing here needs
  # hardware — but it does need a kernel module and root, which is why it is one
  # Linux job rather than part of the matrix above.
  #
  # picotool is built from its own release tag rather than taken from a
  # distribution, so what this measures compatibility against is a version that
  # can be named.
  picotool:
    runs-on: ubuntu-latest
    env:
      PICOTOOL_TAG: '2.1.1'
    steps:
      - uses: actions/checkout@v4

      - name: Load vhci-hcd
        run: |
          sudo modprobe vhci-hcd || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vhci-hcd
          }
          test -d /sys/devices/platform/vhci_hcd.0

      - name: Build picotool
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libusb-1.0-0-dev pkg-config
          git clone --depth 1 --branch "$PICOTOOL_TAG" \
              https://github.com/raspberrypi/picotool.git
          git clone --depth 1 --branch "$PICOTOOL_TAG" \
              https://github.com/raspberrypi/pico-sdk.git
          cmake -S picotool -B picotool/build -DPICO_SDK_PATH="$PWD/pico-sdk"
          cmake --build picotool/build -j"$(nproc)"
          sudo cp picotool/build/picotool /usr/local/bin/
          picotool version

      - name: Drive it with picotool
        run: make test-usbip

  # The same device, driven by picoboot-rs instead of picotool.  It reaches the
  # kernel through nusb rather than libusb, so this is a second USB stack as well
  # as a second implementation of the protocol.
  #
  # picoboot-rs is tracked rather than pinned.  A break between it and picobootx
  # is what this exists to report, and a pin would hide one until somebody moved
  # it.
  picoboot-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load vhci-hcd
        run: |
          sudo modprobe vhci-hcd || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vhci-hcd
          }
          test -d /sys/devices/platform/vhci_hcd.0

      - name: Drive it with picoboot-rs
        run: make test-rust
