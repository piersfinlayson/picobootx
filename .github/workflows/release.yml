name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

jobs:
  # A tag is not released until it builds and its tests pass.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build tinyusb example
        run: make example

      - name: Run the conformance suite
        run: make test

      - name: Check the tag matches the version in the header
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          header=$(sed -n 's/.*PICOBOOTX_VERSION_STRING "\(.*\)".*/\1/p' \
                   include/picobootx_version.h)
          if [ "$tag" != "v$header" ]; then
            echo "tag $tag does not match PICOBOOTX_VERSION_STRING $header"
            exit 1
          fi

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The release notes are the CHANGELOG's section for this version, so the
      # two cannot say different things.
      - name: Extract the release notes
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # A version heading carries the release date after the version, so the
          # heading is matched on the version and on what separates the two.
          # Requiring that separator keeps 0.2.0 from matching 0.2.0-rc1.
          awk -v h="## ${tag#v}" '
            substr($0, 1, length(h)) == h &&
              (length($0) == length(h) ||
               substr($0, length(h) + 1, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $tag"
            exit 1
          fi
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "picobootx $tag" \
            --notes-file release-notes.md
